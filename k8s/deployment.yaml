
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar-demo
  labels:
    app: sonar-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sonar-demo
  template:
    metadata:
      labels:
        app: sonar-demo
    spec:
      containers:
        - name: sonar-demo
          image: prabha1221/sonar-demo:3
          ports:
            - containerPort: 8000

