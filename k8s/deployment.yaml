apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar-demo
  labels:
    app: sonar-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sonar-demo
  template:
    metadata:
      labels:
        app: sonar-demo
    spec:
      containers:
        - name: sonar-demo
          image: python:3.12-slim
          command: ["python", "-c"]
          args:
            - "from http.server import HTTPServer, BaseHTTPRequestHandler; H=type('H',(BaseHTTPRequestHandler,),{'do_GET':lambda s:(s.send_response(200),s.end_headers(),s.wfile.write(b'sonar-demo is running'))}); HTTPServer(('0.0.0.0',8000),H).serve_forever()"
          ports:
            - containerPort: 8000
